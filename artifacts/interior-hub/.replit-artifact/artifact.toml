kind = "web"
previewPath = "/"
title = "InteriorHub Admin Dashboard"
version = "1.0.0"
id = "artifacts/interior-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24644

[services.development]
run = "pnpm --filter @workspace/interior-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/interior-hub", "run", "build" ]
publicDir = "artifacts/interior-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24644"
BASE_PATH = "/"
